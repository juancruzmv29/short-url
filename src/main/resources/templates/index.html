<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>

    <h1>Acortador de urls</h1>
    <form th:action="/" method="post">
        <label for="url">Ingrese aquí su url para recortar</label>
        <div>
            <input type="text" id="url" placeholder="www.google.com" name="url" th:field="*{url}" required >
            <button type="submit">Recortar</button>
        </div>

        <a href="/">
            <button type="button">Borrar</button>
        </a>
    </form>

    <div th:if="${shortUrl}">
        <h2 th:text="${shortUrl.url}"></h2>
        <h2 th:text="${shortUrl.shortUrl}"></h2>
        <p><a th:href="${shortUrl.shortUrl}" ></a></p>
    </div>

    <a href="/listofurls">Ver la url recortadas</a>

</body>
</html>
